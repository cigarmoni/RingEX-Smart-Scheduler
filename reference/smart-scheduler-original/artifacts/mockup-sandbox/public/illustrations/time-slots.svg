<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="92" fill="#f5f6f9"/>
  <!-- Card -->
  <rect x="36" y="48" width="128" height="104" rx="12" fill="#ffffff" stroke="#dddfe5" stroke-width="2"/>
  <!-- Header line -->
  <rect x="48" y="60" width="40" height="6" rx="3" fill="#72757a"/>
  <rect x="48" y="72" width="64" height="4" rx="2" fill="#dddfe5"/>
  <!-- Slot rows -->
  <g>
    <rect x="48" y="88" width="56" height="14" rx="7" fill="#5d7ce8"/>
    <text x="76" y="98" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700">9:00 AM</text>

    <rect x="110" y="88" width="42" height="14" rx="7" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
    <text x="131" y="98" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="600">10:30</text>

    <rect x="48" y="108" width="42" height="14" rx="7" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
    <text x="69" y="118" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="600">11:00</text>

    <rect x="96" y="108" width="56" height="14" rx="7" fill="#ff7a00"/>
    <text x="124" y="118" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="700">1:00 PM</text>

    <rect x="48" y="128" width="42" height="14" rx="7" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
    <text x="69" y="138" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="600">2:30</text>
    <rect x="96" y="128" width="42" height="14" rx="7" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
    <text x="117" y="138" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" font-weight="600">4:00</text>
  </g>
  <!-- Cursor -->
  <g transform="translate(118 110)">
    <path d="M0 0 L0 14 L4 10 L7 16 L10 15 L7 9 L12 9 Z" fill="#72757a" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
