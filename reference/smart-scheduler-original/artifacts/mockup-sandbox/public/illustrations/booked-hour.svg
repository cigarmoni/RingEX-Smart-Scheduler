<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="92" fill="#f5f6f9"/>

  <!-- Clock face -->
  <circle cx="100" cy="104" r="56" fill="#ffffff" stroke="#dddfe5" stroke-width="2.5"/>

  <!-- Booked slice (2pm-3pm = 60° wedge from 12 o'clock, rotated +60°) -->
  <path d="M100 104 L100 48 A56 56 0 0 1 148.5 132 Z" fill="#ffffff"/>
  <!-- Highlight a 1-hour wedge (e.g. 2 to 3 = 60-90 deg) -->
  <path d="M100 104 L148.5 76 A56 56 0 0 1 156 104 Z" fill="#ff7a00" fill-opacity="0.15"/>
  <path d="M100 104 L148.5 76 A56 56 0 0 1 156 104 Z" stroke="#ff7a00" stroke-width="2" fill="none"/>

  <!-- Hour ticks -->
  <g stroke="#9e9fa4" stroke-width="2" stroke-linecap="round">
    <line x1="100" y1="52" x2="100" y2="58"/>
    <line x1="148" y1="78" x2="143" y2="82"/>
    <line x1="152" y1="104" x2="146" y2="104"/>
    <line x1="148" y1="130" x2="143" y2="126"/>
    <line x1="100" y1="156" x2="100" y2="150"/>
    <line x1="52" y1="130" x2="57" y2="126"/>
    <line x1="48" y1="104" x2="54" y2="104"/>
    <line x1="52" y1="78" x2="57" y2="82"/>
  </g>

  <!-- Hour numbers (12, 3, 6, 9) -->
  <text x="100" y="68" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700">12</text>
  <text x="140" y="108" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700">3</text>
  <text x="100" y="146" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700">6</text>
  <text x="62" y="108" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700">9</text>

  <!-- Hands pointing to 2:00 -->
  <line x1="100" y1="104" x2="130" y2="78" stroke="#72757a" stroke-width="3" stroke-linecap="round"/>
  <line x1="100" y1="104" x2="100" y2="68" stroke="#72757a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="104" r="4" fill="#5d7ce8"/>

  <!-- Booked badge (top right) -->
  <g transform="translate(140 36)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="#ffffff" stroke="#16a937" stroke-width="2"/>
    <circle cx="11" cy="11" r="6" fill="#16a937"/>
    <path d="M8 11 l2 2 l4 -4" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="34" y="15" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="700">Booked</text>
  </g>
</svg>
