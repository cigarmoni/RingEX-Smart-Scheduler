<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="92" fill="#f5f6f9"/>
  <!-- Phone -->
  <rect x="64" y="34" width="72" height="132" rx="14" fill="#ffffff" stroke="#dddfe5" stroke-width="2.5"/>
  <rect x="70" y="42" width="60" height="116" rx="8" fill="#f5f6f9"/>
  <!-- Status notch -->
  <rect x="92" y="40" width="16" height="4" rx="2" fill="#dddfe5"/>
  <!-- Booking title -->
  <rect x="76" y="52" width="34" height="6" rx="3" fill="#72757a"/>
  <rect x="76" y="62" width="48" height="4" rx="2" fill="#9e9fa4"/>
  <!-- Mini calendar grid -->
  <g>
    <rect x="76" y="74" width="48" height="36" rx="5" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
    <g fill="#dddfe5">
      <circle cx="84" cy="84" r="2"/><circle cx="92" cy="84" r="2"/><circle cx="100" cy="84" r="2"/><circle cx="108" cy="84" r="2"/><circle cx="116" cy="84" r="2"/>
      <circle cx="84" cy="94" r="2"/><circle cx="92" cy="94" r="2"/><circle cx="108" cy="94" r="2"/><circle cx="116" cy="94" r="2"/>
      <circle cx="84" cy="104" r="2"/><circle cx="116" cy="104" r="2"/>
    </g>
    <circle cx="100" cy="94" r="3.5" fill="#5d7ce8"/>
    <circle cx="92" cy="104" r="3.5" fill="#ff7a00"/>
    <circle cx="108" cy="104" r="3.5" fill="#ff7a00"/>
  </g>
  <!-- Slot pill -->
  <rect x="76" y="118" width="48" height="10" rx="5" fill="#5d7ce8"/>
  <text x="100" y="126" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700">2:30 PM Tue</text>
  <!-- Confirm button -->
  <rect x="76" y="134" width="48" height="12" rx="6" fill="#ff7a00"/>
  <text x="100" y="143" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700">Book now</text>

  <!-- Confirmation toast -->
  <g transform="translate(124 28)">
    <rect x="0" y="0" width="56" height="32" rx="8" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
    <circle cx="14" cy="16" r="8" fill="#16a937"/>
    <path d="M10 16 l3 3 l5 -6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="26" y="10" width="24" height="4" rx="2" fill="#72757a"/>
    <rect x="26" y="18" width="20" height="3" rx="1.5" fill="#9e9fa4"/>
  </g>
</svg>
