    <text x="22" y="13" text-anchor="middle" fill="#72757a" font-family="Inter, Helvetica, Arial, sans-serif" font-size="7" font-weight="700">Booked</text>
  </g>

  <!-- Hangers -->
  <rect x="34" y="60" width="4" height="14" rx="2" fill="#72757a"/>
  <rect x="70" y="60" width="4" height="14" rx="2" fill="#72757a"/>
  <rect x="126" y="60" width="4" height="14" rx="2" fill="#72757a"/>
  <rect x="162" y="60" width="4" height="14" rx="2" fill="#72757a"/>
