    <circle cx="44" cy="112" r="3.5" fill="#5d7ce8"/>
    <circle cx="56" cy="126" r="3.5" fill="#5d7ce8"/>
    <circle cx="80" cy="126" r="3.5" fill="#5d7ce8"/>
