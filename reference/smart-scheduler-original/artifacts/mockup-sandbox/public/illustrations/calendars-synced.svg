  <!-- Sync arc + matched slot -->
  <path d="M88 106 q12 -22 24 0" stroke="#9e9fa4" stroke-width="1.8" stroke-dasharray="3 3" fill="none"/>
  <g transform="translate(92 56)">
    <rect x="0" y="0" width="36" height="20" rx="6" fill="#ffffff" stroke="#16a937" stroke-width="2"/>
    <circle cx="9" cy="10" r="4" fill="#16a937"/>
