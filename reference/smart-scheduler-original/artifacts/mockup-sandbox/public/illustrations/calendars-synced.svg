      <circle cx="124" cy="112" r="2"/><circle cx="148" cy="112" r="2"/><circle cx="160" cy="112" r="2"/>
      <circle cx="124" cy="126" r="2"/><circle cx="136" cy="126" r="2"/><circle cx="160" cy="126" r="2"/><circle cx="172" cy="126" r="2"/>
