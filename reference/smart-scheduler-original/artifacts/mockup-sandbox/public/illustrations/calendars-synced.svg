    <rect x="20" y="68" width="68" height="16" rx="8" fill="#5d7ce8"/>
    <rect x="20" y="76" width="68" height="8" fill="#5d7ce8"/>
    <g fill="#dddfe5">
      <circle cx="32" cy="98" r="2"/><circle cx="44" cy="98" r="2"/><circle cx="56" cy="98" r="2"/><circle cx="68" cy="98" r="2"/><circle cx="80" cy="98" r="2"/>
      <circle cx="32" cy="112" r="2"/><circle cx="56" cy="112" r="2"/><circle cx="68" cy="112" r="2"/><circle cx="80" cy="112" r="2"/>
      <circle cx="32" cy="126" r="2"/><circle cx="44" cy="126" r="2"/><circle cx="68" cy="126" r="2"/>
