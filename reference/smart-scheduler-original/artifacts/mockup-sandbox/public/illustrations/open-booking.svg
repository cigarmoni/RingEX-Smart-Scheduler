<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="92" fill="#f5f6f9"/>
  <!-- Calendar body -->
  <rect x="44" y="56" width="112" height="100" rx="10" fill="#ffffff" stroke="#dddfe5" stroke-width="2"/>
  <rect x="44" y="56" width="112" height="22" rx="10" fill="#5d7ce8"/>
  <rect x="44" y="68" width="112" height="10" fill="#5d7ce8"/>
  <!-- Hangers -->
  <rect x="64" y="46" width="6" height="20" rx="3" fill="#72757a"/>
  <rect x="130" y="46" width="6" height="20" rx="3" fill="#72757a"/>
  <!-- Grid dots -->
  <g fill="#dddfe5">
    <circle cx="62" cy="98" r="3"/><circle cx="80" cy="98" r="3"/><circle cx="98" cy="98" r="3"/><circle cx="116" cy="98" r="3"/><circle cx="134" cy="98" r="3"/>
    <circle cx="62" cy="118" r="3"/><circle cx="80" cy="118" r="3"/><circle cx="98" cy="118" r="3"/><circle cx="116" cy="118" r="3"/><circle cx="134" cy="118" r="3"/>
    <circle cx="62" cy="138" r="3"/><circle cx="80" cy="138" r="3"/><circle cx="98" cy="138" r="3"/><circle cx="116" cy="138" r="3"/><circle cx="134" cy="138" r="3"/>
  </g>

  <!-- OPEN ribbon banner (draped diagonally over corner) -->
  <g transform="translate(108 44) rotate(20)">
    <rect x="-8" y="0" width="80" height="22" rx="4" fill="#ff7a00"/>
    <rect x="-8" y="0" width="80" height="22" rx="4" fill="url(#ribbonShade)" opacity="0.0"/>
    <text x="32" y="15" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="1">OPEN</text>
    <!-- Ribbon ends -->
    <polygon points="-8,0 -16,8 -8,16" fill="#c95c00"/>
    <polygon points="72,0 80,8 72,16" fill="#c95c00"/>
  </g>

  <!-- Tiny availability dot pulses -->
  <circle cx="80" cy="138" r="3" fill="#16a937"/>
  <circle cx="116" cy="118" r="3" fill="#16a937"/>
  <circle cx="62" cy="118" r="3" fill="#16a937"/>
</svg>
