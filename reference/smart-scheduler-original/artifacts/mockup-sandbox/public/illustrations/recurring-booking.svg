<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="92" fill="#f5f6f9"/>

  <!-- Calendar body -->
  <rect x="44" y="56" width="112" height="100" rx="10" fill="#ffffff" stroke="#dddfe5" stroke-width="2"/>
  <rect x="44" y="56" width="112" height="22" rx="10" fill="#5d7ce8"/>
  <rect x="44" y="68" width="112" height="10" fill="#5d7ce8"/>
  <rect x="64" y="46" width="6" height="20" rx="3" fill="#72757a"/>
  <rect x="130" y="46" width="6" height="20" rx="3" fill="#72757a"/>

  <!-- Grid dots (faint) -->
  <g fill="#dddfe5">
    <circle cx="62" cy="98" r="3"/><circle cx="80" cy="98" r="3"/><circle cx="98" cy="98" r="3"/><circle cx="116" cy="98" r="3"/><circle cx="134" cy="98" r="3"/>
    <circle cx="62" cy="118" r="3"/><circle cx="80" cy="118" r="3"/><circle cx="98" cy="118" r="3"/><circle cx="116" cy="118" r="3"/><circle cx="134" cy="118" r="3"/>
    <circle cx="62" cy="138" r="3"/><circle cx="80" cy="138" r="3"/><circle cx="98" cy="138" r="3"/><circle cx="116" cy="138" r="3"/><circle cx="134" cy="138" r="3"/>
  </g>

  <!-- Same weekday recurring pills (column) -->
  <rect x="92" y="92" width="14" height="12" rx="4" fill="#ff7a00"/>
  <rect x="92" y="112" width="14" height="12" rx="4" fill="#ff7a00"/>
  <rect x="92" y="132" width="14" height="12" rx="4" fill="#ff7a00"/>

  <!-- Down arrow chain -->
  <path d="M99 105 L99 110" stroke="#ff7a00" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M99 125 L99 130" stroke="#ff7a00" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Recurring badge (top-right) -->
  <g transform="translate(132 44)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#5d7ce8" stroke-width="2"/>
    <!-- Refresh / recurring arrows -->
    <path d="M9 13 a7 7 0 0 1 12 -2" stroke="#5d7ce8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="20,8 24,12 18,12" fill="#5d7ce8"/>
    <path d="M23 19 a7 7 0 0 1 -12 2" stroke="#5d7ce8" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="12,24 8,20 14,20" fill="#5d7ce8"/>
  </g>
</svg>
