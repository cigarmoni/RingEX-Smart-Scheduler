<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <circle cx="100" cy="100" r="92" fill="#f5f6f9"/>
  <!-- Booking page card -->
  <rect x="38" y="40" width="92" height="120" rx="10" fill="#ffffff" stroke="#dddfe5" stroke-width="2"/>
  <!-- Avatar -->
  <circle cx="84" cy="66" r="12" fill="#5d7ce8"/>
  <text x="84" y="70" text-anchor="middle" fill="#ffffff" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">A</text>
  <!-- Name + role -->
  <rect x="56" y="86" width="56" height="6" rx="3" fill="#72757a"/>
  <rect x="62" y="96" width="44" height="4" rx="2" fill="#9e9fa4"/>
  <!-- Slot pills -->
  <rect x="50" y="112" width="32" height="10" rx="5" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
  <rect x="86" y="112" width="32" height="10" rx="5" fill="#5d7ce8"/>
  <rect x="50" y="128" width="32" height="10" rx="5" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
  <rect x="86" y="128" width="32" height="10" rx="5" fill="#ffffff" stroke="#dddfe5" stroke-width="1.5"/>
  <rect x="50" y="144" width="68" height="10" rx="5" fill="#ff7a00"/>

  <!-- Link badge -->
  <g transform="translate(126 96)">
    <circle cx="22" cy="22" r="22" fill="#ffffff" stroke="#dddfe5" stroke-width="2"/>
    <!-- Chain link icon -->
    <path d="M14 22 a4 4 0 0 1 4 -4 h4 a4 4 0 0 1 0 8 h-2" stroke="#ff7a00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M30 22 a4 4 0 0 1 -4 4 h-4 a4 4 0 0 1 0 -8 h2" stroke="#5d7ce8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Connection arc -->
  <path d="M130 76 q24 -18 38 14" stroke="#5d7ce8" stroke-width="2" stroke-dasharray="3 4" stroke-linecap="round" fill="none"/>
  <circle cx="168" cy="90" r="3" fill="#5d7ce8"/>
</svg>
